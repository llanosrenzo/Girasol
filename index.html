<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tulipanes</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    .title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 40px;
      font-weight: bold;
      text-align: center;
      width: 80%;
      text-shadow: 0 0 10px #FFD700, 0 0 20px #FFA500;
      z-index: 2;
    }
    .word {
      position: absolute;
      font-family: Arial, sans-serif;
      font-size: 22px;
      font-weight: bold;
      color: #FFD700;
      opacity: 0.9;
      text-shadow: 0 0 5px #FFA500, 0 0 10px #FF4500;
      animation: floatUp 6s linear forwards;
    }
    @keyframes floatUp {
      0% {
        transform: translateY(0);
        opacity: 1;
      }
      100% {
        transform: translateY(-200px);
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="title" id="title"></div>
  <canvas id="canvas"></canvas>

  <script>
    // ✍️ Preguntar nombre
    const nombre = prompt("¿Cuál es tu nombre?") || "Amigo";
    document.getElementById("title").innerText = `${nombre}, que tu sonrisa florezca hoy.`;

    // 🎨 Configuración del canvas
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let w, h;
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // 🌼 Clase Tulip
    class Tulip {
      constructor() {
        this.x = Math.random() * w;
        this.y = h + Math.random() * 100;
        this.speed = 1 + Math.random() * 2;
        this.stemHeight = 40 + Math.random() * 40;
        this.size = 12 + Math.random() * 8;
      }
      draw() {
        // Tallo
        ctx.strokeStyle = "#228B22";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x, this.y - this.stemHeight);
        ctx.stroke();

        // Flor
        ctx.fillStyle = "#FFD700";
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - this.stemHeight);
        ctx.bezierCurveTo(
          this.x - this.size, this.y - this.stemHeight - this.size,
          this.x - this.size, this.y - this.stemHeight - this.size * 2,
          this.x, this.y - this.stemHeight - this.size * 2
        );
        ctx.bezierCurveTo(
          this.x + this.size, this.y - this.stemHeight - this.size * 2,
          this.x + this.size, this.y - this.stemHeight - this.size,
          this.x, this.y - this.stemHeight
        );
        ctx.closePath();
        ctx.fill();
      }
      update() {
        this.y -= this.speed;
        if (this.y < -50) {
          this.x = Math.random() * w;
          this.y = h + 50;
        }
        this.draw();
      }
    }

    // 🌷 Generar tulipanes
    const tulips = [];
    for (let i = 0; i < 80; i++) tulips.push(new Tulip());

    function animate() {
      ctx.clearRect(0, 0, w, h);
      tulips.forEach(t => t.update());
      requestAnimationFrame(animate);
    }
    animate();

    // 💫 Palabras emergentes
    const words = ["Amistad", "Love", "Alegría", "Paz", "Felicidad", "Esperanza", "Sueños"];
    
    function createWord() {
      const word = document.createElement("div");
      word.className = "word";
      word.innerText = words[Math.floor(Math.random() * words.length)];
      word.style.left = Math.random() * (window.innerWidth - 100) + "px";
      word.style.top = (window.innerHeight - 100) + "px";
      document.body.appendChild(word);

      // Eliminar palabra cuando termine animación
      setTimeout(() => {
        word.remove();
      }, 6000);
    }

    // Crear palabras cada cierto tiempo
    setInterval(createWord, 2000);
  </script>
</body>
</html>
