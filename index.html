<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tulipanes</title>
  <style>
    body {
      margin: 0;
      background: black;
      overflow: hidden;
    }
    canvas {
      display: block;
    }
    .title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 40px;
      font-weight: bold;
      text-align: center;
      width: 80%;
      text-shadow: 0 0 10px #FFD700, 0 0 20px #FFA500;
      z-index: 2;
    }
    .word {
      position: absolute;
      font-family: Arial, sans-serif;
      font-size: 22px;
      font-weight: bold;
      opacity: 0.9;
      text-shadow: 0 0 5px #FFA500, 0 0 10px #FF4500;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="title" id="title"></div>
  <canvas id="canvas"></canvas>

  <script>
    // ✍️ Preguntar nombre
    const nombre = prompt("¿Cuál es tu nombre?") || "Amig@";
    document.getElementById("title").innerText = `${nombre}, que tu sonrisa florezca hoy.`;

    // 🎨 Configuración del canvas
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    let w, h;
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // 🌼 Clase Tulip
    class Tulip {
      constructor() {
        this.x = Math.random() * w;
        this.y = h + Math.random() * 100;
        this.speed = 1 + Math.random() * 2;
        this.stemHeight = 40 + Math.random() * 40;
        this.size = 12 + Math.random() * 8;
      }
      draw() {
        // Tallo
        ctx.strokeStyle = "#228B22";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x, this.y - this.stemHeight);
        ctx.stroke();

        // Flor
        ctx.fillStyle = "#FFD700";
        ctx.beginPath();
        ctx.moveTo(this.x, this.y - this.stemHeight);
        ctx.bezierCurveTo(
          this.x - this.size, this.y - this.stemHeight - this.size,
          this.x - this.size, this.y - this.stemHeight - this.size * 2,
          this.x, this.y - this.stemHeight - this.size * 2
        );
        ctx.bezierCurveTo(
          this.x + this.size, this.y - this.stemHeight - this.size * 2,
          this.x + this.size, this.y - this.stemHeight - this.size,
          this.x, this.y - this.stemHeight
        );
        ctx.closePath();
        ctx.fill();
      }
      update() {
        this.y -= this.speed;
        if (this.y < -50) {
          this.x = Math.random() * w;
          this.y = h + 50;
        }
        this.draw();
      }
    }

    // 🌷 Generar tulipanes
    const tulips = [];
    for (let i = 0; i < 80; i++) tulips.push(new Tulip());

    function animate() {
      ctx.clearRect(0, 0, w, h);
      tulips.forEach(t => t.update());
      requestAnimationFrame(animate);
    }
    animate();

    // 💫 Palabras emergentes
    const words = [
      "Amistad", "Love", "Alegría", "Paz", "Felicidad", "Esperanza", "Sueños",
      "Complicidad", "Sonrisa", "Abrazos", "Recuerdos", "Magia", "Cariño", "Luz",
      "Gratitud", "Energía", "Sueña en grande", "Sonríe"
    ];

    const colors = ["#FFD700", "#FF69B4", "#87CEEB", "#ADFF2F", "#FF4500", "#BA55D3", "#00FA9A"];

    function createWord() {
      const word = document.createElement("div");
      word.className = "word";
      word.innerText = words[Math.floor(Math.random() * words.length)];

      // Posición aleatoria en pantalla
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 100);
      word.style.left = `${x}px`;
      word.style.top = `${y}px`;

      // Color aleatorio
      word.style.color = colors[Math.floor(Math.random() * colors.length)];

      // Animación: flotar hacia arriba y desvanecerse
      word.animate(
        [
          { transform: "translateY(0)", opacity: 1 },
          { transform: "translateY(-120px)", opacity: 0 }
        ],
        {
          duration: 4000,
          easing: "ease-out",
          fill: "forwards"
        }
      );

      document.body.appendChild(word);

      // Eliminar palabra tras animación
      setTimeout(() => {
        word.remove();
      }, 6000);
    }

    // Crear palabras cada cierto tiempo
    setInterval(createWord, 1500);
  </script>
</body>
</html>
