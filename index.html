<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Girasol</title>
  <style>
    body {
      margin: 0;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    canvas {
      background: black;
    }
  </style>
</head>
<body>
  <canvas id="canvas" width="700" height="700"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;
    ctx.translate(w/2, h/2); // origen al centro

    // 🌼 Dibujar pétalos
    function drawPetals() {
      const numPetals = 36;
      const radius = 200;
      for (let i=0; i<numPetals; i++) {
        const angle = (2 * Math.PI / numPetals) * i;
        const x = Math.cos(angle) * radius;
        const y = Math.sin(angle) * radius;
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);
        ctx.beginPath();
        ctx.ellipse(0, 0, 30, 80, 0, 0, Math.PI*2);
        ctx.fillStyle = "#FFA216"; // amarillo
        ctx.fill();
        ctx.restore();
      }
    }

    // 🌻 Semillas en espiral (Fibonacci)
    function drawSeeds() {
      const goldenAngle = Math.PI * (3 - Math.sqrt(5)); // ángulo áureo
      for (let i = 0; i < 500; i++) {
        const r = Math.sqrt(i) * 6;
        const theta = i * goldenAngle;
        const x = r * Math.cos(theta);
        const y = r * Math.sin(theta);
        ctx.beginPath();
        ctx.arc(x, y, 3, 0, Math.PI * 2);
        ctx.fillStyle = "#5A381E"; // marrón oscuro
        ctx.fill();
      }
    }

    // 🌑 Disco central
    function drawCenter() {
      ctx.beginPath();
      ctx.arc(0, 0, 120, 0, Math.PI*2);
      ctx.fillStyle = "#8B4513"; // marrón
      ctx.fill();
    }

    // ✍️ Texto
    function drawText() {
      ctx.fillStyle = "white";
      ctx.font = "bold 24px Arial";
      ctx.textAlign = "center";
      ctx.fillText("AMISTAD", 0, 260);
    }

    // Dibujar todo
    drawPetals();
    drawCenter();
    drawSeeds();
    drawText();
  </script>
</body>
</html>
